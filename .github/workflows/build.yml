name: Windows build and preview
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build NikotFiler.slnx -c Release
      - name: Regression checks
        run: dotnet tests/NikotFiler.Tests/bin/Release/net10.0-windows/NikotFiler.Tests.dll
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: nikotFiler-ui-checks
          path: artifacts/ui-checks/*.png
      - name: Publish Windows x64 without runtime
        run: dotnet publish src/NikotFiler.App -c Release -r win-x64 --self-contained false -p:UseAppHost=true -o artifacts/nikotFiler-win-x64-framework-dependent
      - name: Verify framework-dependent package
        shell: pwsh
        run: |
          $publishDir = 'artifacts/nikotFiler-win-x64-framework-dependent'
          foreach ($required in @('nikotFiler.exe', 'nikotFiler.dll', 'NikotFiler.Core.dll', 'nikotFiler.runtimeconfig.json', 'nikotFiler.deps.json')) {
            if (-not (Test-Path -LiteralPath (Join-Path $publishDir $required))) { throw "Missing app file: $required" }
          }
          $runtimeFiles = @(Get-ChildItem -LiteralPath $publishDir -Recurse -File | Where-Object { $_.Name -in @('coreclr.dll', 'clrjit.dll', 'hostfxr.dll', 'hostpolicy.dll', 'System.Private.CoreLib.dll', 'PresentationFramework.dll') })
          if ($runtimeFiles.Count -gt 0) { throw 'Runtime binaries must not be bundled.' }
          $config = Get-Content -LiteralPath (Join-Path $publishDir 'nikotFiler.runtimeconfig.json') -Raw | ConvertFrom-Json
          if ($config.runtimeOptions.includedFrameworks) { throw 'Self-contained runtime configuration found.' }
          if ('Microsoft.WindowsDesktop.App' -notin @($config.runtimeOptions.frameworks.name)) { throw 'Windows Desktop Runtime reference missing.' }
      - name: Package
        shell: pwsh
        run: |
          Copy-Item README.md artifacts/nikotFiler-win-x64-framework-dependent/README.md
          Compress-Archive -Path artifacts/nikotFiler-win-x64-framework-dependent/* -DestinationPath artifacts/nikotFiler-0.1.0-win-x64-framework-dependent.zip
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: nikotFiler-win-x64-framework-dependent
          path: artifacts/nikotFiler-0.1.0-win-x64-framework-dependent.zip
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: nikotFiler-win-x64-framework-dependent
          path: artifacts
      - name: Create preview release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/*.zip --prerelease --title "nikotFiler $GITHUB_REF_NAME (runtime not bundled)" --notes-file docs/public/release-notes.md
