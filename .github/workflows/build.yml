name: Windows build and preview
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build NikotFiler.slnx -c Release
      - name: Regression checks
        run: dotnet tests/NikotFiler.Tests/bin/Release/net10.0-windows/NikotFiler.Tests.dll
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: nikotFiler-ui-checks
          path: artifacts/ui-checks/*.png
      - name: Publish Windows x64
        run: dotnet publish src/NikotFiler.App -c Release -r win-x64 --self-contained true -o artifacts/nikotFiler-win-x64
      - name: Package
        shell: pwsh
        run: |
          Copy-Item README.md artifacts/nikotFiler-win-x64/README.md
          Compress-Archive -Path artifacts/nikotFiler-win-x64/* -DestinationPath artifacts/nikotFiler-0.1.0-win-x64.zip
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: nikotFiler-win-x64
          path: artifacts/nikotFiler-0.1.0-win-x64.zip
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: nikotFiler-win-x64
          path: artifacts
      - name: Create preview release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/*.zip --prerelease --title "nikotFiler $GITHUB_REF_NAME Preview" --notes-file docs/public/release-v0.1.0.md
